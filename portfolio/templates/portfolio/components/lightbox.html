<!-- ============================================================
     LIGHTBOX
============================================================ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Project details">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close lightbox"><i class="fas fa-times"></i></button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>
  
  <div class="lightbox-container">
    <div class="lightbox-content">
      <div class="lightbox-img-container">
        <img id="lightboxImg" src="" alt="">
      </div>
      <div class="lightbox-metadata">
        <div class="lightbox-meta-top">
          <span class="lightbox-cat" id="lightboxCat"></span>
          <div class="lightbox-location" id="lightboxLoc" style="display: none;"><i class="fas fa-map-marker-alt"></i> <span></span></div>
        </div>
        <h3 class="lightbox-title" id="lightboxTitle"></h3>
        <p class="lightbox-desc" id="lightboxDesc"></p>
      </div>
    </div>
  </div>
  
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>
</div>
